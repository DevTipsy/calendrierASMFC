name: Update ASM calendar
on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12h (UTC)
  workflow_dispatch:          # bouton manuel

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer l'ICS
        run: python3 asm_calendar.py
      - name: Commit si changement
        run: |
          git config user.name "asm-bot"
          git config user.email "asm-bot@users.noreply.github.com"
          git add asmonaco.ics
          git commit -m "chore: maj calendrier $(date -u +%Y-%m-%dT%H:%MZ)" || echo "aucun changement"
          git push
